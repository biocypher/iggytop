row:
  chain_id:
    columns: [chain_1_type, chain_1_cdr3, chain_1_v_call, chain_1_j_call]
    to_subject: chain_1

transformers:
  - map:
      column: chain_1_type
      to_property: locus
      for_object: chain_1
  - map:
      column: chain_1_cdr3
      to_property: cdr3_aa
      for_object: chain_1
  - map:
      column: chain_1_junction_aa
      to_property: junction_aa
      for_object: chain_1
  - map:
      column: chain_1_v_call
      to_property: v_call
      for_object: chain_1
  - map:
      column: chain_1_j_call
      to_property: j_call
      for_object: chain_1
  - map:
      column: chain_1_organism
      to_property: organism
      for_object: chain_1
  - map:
      column: chain_1_complete
      to_property: complete
      for_object: chain_1

  - prefixed_id:
      columns: [chain_1_v_call]
      prefix: v_gene
      to_object: v_gene
      via_relation: chain_1_to_v_gene

  - prefixed_id:
      columns: [chain_1_j_call]
      prefix: j_gene
      to_object: j_gene
      via_relation: chain_1_to_j_gene
