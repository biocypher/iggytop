name: Bimonthly Data Release

on:
  schedule:
    - cron: '0 0 1 */2 *' # 1st day of every 2nd month
  workflow_dispatch: # Allow manual trigger
    inputs:
      release_tag:
        description: 'Publish an existing release (e.g. data-2026.11.01.025333) and skip the data pipeline'
        type: string
        default: ''
      promote:
        description: 'Push :latest and mark the release Latest (scheduled runs always promote)'
        type: boolean
        default: false

jobs:
  build_release:
    if: inputs.release_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Generate release tag
        id: tag
        run: echo "tag=data-$(date -u +'%Y.%m.%d.%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Run release pipeline (AnnData, AIRR JSON & knowledge graph)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Separate Cache (for computation) and Release (for final assets)
          mkdir -p /tmp/iggytop_cache
          mkdir -p /tmp/iggytop_release

          # Single pass over every adapter: builds each source table once and emits the raw
          # merged dataset, the filtered+deduplicated dataset, and the neo4j graph files from it.
          uv run create_release.py --cache-dir /tmp/iggytop_cache --filter-10x --tag ${{ steps.tag.outputs.tag }}

          cp /tmp/iggytop_cache/merged* /tmp/iggytop_release/
          cp /tmp/iggytop_cache/deduplicated* /tmp/iggytop_release/

          # Package the neo4j-import-ready knowledge graph (CSVs + neo4j-admin-import-call.sh) as a
          # single release asset. Filename is fixed (not tag-suffixed) so it can be fetched via the
          # stable GitHub "latest release" asset URL, e.g. by docker/local_kg's build step.
          tar -czf /tmp/iggytop_release/knowledge_graph.tar.gz -C /tmp/iggytop_cache knowledge_graph

      - name: Generate Release Notes Table
        id: release_notes
        run: |
          uv run iggytop-release --release-dir /tmp/iggytop_release

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        if: ${{ !contains(github.actor, 'act') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Data Release ${{ steps.tag.outputs.tag }}
          body_path: /tmp/iggytop_release/RELEASE_NOTES.md
          files: |
            /tmp/iggytop_release/*
          draft: false
          prerelease: true

      - name: Keep container alive for inspection (Local only)
        if: contains(github.actor, 'act')
        run: |
          echo "Workflow finished successfully."
          echo "Assets are in: /tmp/iggytop_release"
          echo "Cache is in: /tmp/iggytop_cache"
          echo "Waiting 5 minutes before cleanup..."
          sleep 300

  # Separate job so "Re-run failed jobs" (or a dispatch with release_tag) resumes from the
  # image push without rerunning the ~60 min data pipeline.
  publish:
    needs: build_release
    if: ${{ !cancelled() && (needs.build_release.result == 'success' || inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ inputs.release_tag || needs.build_release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Log in to GHCR
        if: ${{ !contains(github.actor, 'act') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Neo4j knowledge-graph image
        if: ${{ !contains(github.actor, 'act') }}
        run: |
          # Bakes this release's knowledge_graph.tar.gz (published by build_release) into a
          # neo4j:5.26-community image, so users can `docker pull`/`docker compose up`
          # the graph directly instead of building the Dockerfile themselves.
          # The package is public; its visibility is set once in the GHCR package settings.
          docker build \
            --target deploy-stage \
            --build-arg IGGYTOP_RELEASE_TAG="$TAG" \
            -t ghcr.io/biocypher/iggytop-neo4j:"$TAG" \
            .
          for attempt in 1 2 3; do
            echo "push attempt $attempt"
            docker push ghcr.io/biocypher/iggytop-neo4j:"$TAG" && exit 0
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      # Built before :latest is pushed, so a docs failure never leaves a promoted image behind.
      - name: Generate docs
        env:
          IGGYTOP_RELEASE_TAG: ${{ env.TAG }}
        run: uv run --group docs --frozen python -m sphinx -E -b html docs/source docs/build/html

      # Only scheduled runs (or manual runs with promote) push :latest, mirroring the GH Release promotion below.
      - name: Tag & push latest image
        if: ${{ (github.event_name == 'schedule' || inputs.promote) && !contains(github.actor, 'act') }}
        run: |
          docker tag ghcr.io/biocypher/iggytop-neo4j:"$TAG" ghcr.io/biocypher/iggytop-neo4j:latest
          docker push ghcr.io/biocypher/iggytop-neo4j:latest

      # Only scheduled runs (or manual runs with promote) promote the prerelease to the latest release.
      # Other manual workflow_dispatch runs stop at the prerelease so a human can promote it later.
      - name: Promote Pre-Release
        if: ${{ (github.event_name == 'schedule' || inputs.promote) && !contains(github.actor, 'act') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --prerelease=false --latest
