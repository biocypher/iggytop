name: Bimonthly Data Release

on:
  schedule:
    - cron: '0 0 1 */2 *' # 1st day of every 2nd month
  workflow_dispatch: # Allow manual trigger

jobs:
  test_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Generate release tag
        id: tag
        run: echo "tag=data-$(date -u +'%Y.%m.%d.%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Run release pipeline (AnnData, AIRR JSON & knowledge graph)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Separate Cache (for computation) and Release (for final assets)
          mkdir -p /tmp/iggytop_cache
          mkdir -p /tmp/iggytop_release

          # Single pass over every adapter: builds each source table once and emits the raw
          # merged dataset, the filtered+deduplicated dataset, and the neo4j graph files from it.
          uv run create_release.py --cache-dir /tmp/iggytop_cache --filter-10x --tag ${{ steps.tag.outputs.tag }}

          cp /tmp/iggytop_cache/merged* /tmp/iggytop_release/
          cp /tmp/iggytop_cache/deduplicated* /tmp/iggytop_release/
        # TBD: Attach the neo4j graph as a release asset. The CSVs + neo4j-admin-import-call.sh are
        # already produced by this step under biocypher-out/<timestamp>/; still need to decide the
        # distribution format (raw CSVs vs. a neo4j-admin `.dump`, which additionally requires
        # importing into a running Neo4j instance before it can be dumped).

      - name: Generate Release Notes Table
        id: release_notes
        run: |
          uv run iggytop-release --release-dir /tmp/iggytop_release

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        if: ${{ !contains(github.actor, 'act') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Data Release ${{ steps.tag.outputs.tag }}
          body_path: /tmp/iggytop_release/RELEASE_NOTES.md
          files: |
            /tmp/iggytop_release/*
          draft: false
          prerelease: true

      - name: Generate docs
        run: uv run --group docs --frozen python -m sphinx -E -b html docs/source docs/build/html

      # Only scheduled runs promote the prerelease to the latest release.
      # Manual workflow_dispatch runs stop at the prerelease so a human can promote it later.
      - name: Promote Pre-Release
        if: ${{ github.event_name == 'schedule' && !contains(github.actor, 'act') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.tag.outputs.tag }}" --prerelease=false --latest


      - name: Keep container alive for inspection (Local only)
        if: contains(github.actor, 'act')
        run: |
          echo "Workflow finished successfully."
          echo "Assets are in: /tmp/iggytop_release"
          echo "Cache is in: /tmp/iggytop_cache"
          echo "Waiting 5 minutes before cleanup..."
          sleep 300
